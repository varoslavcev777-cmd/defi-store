<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEFI — Clothing</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #ffffff;
      color: #111111;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      height: 78px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 25px;
      font-weight: 900;
      letter-spacing: 7px;
    }

    nav {
      display: flex;
      gap: 28px;
    }

    nav a {
      color: #111;
      text-decoration: none;
      font-size: 13px;
      transition: opacity 0.2s;
    }

    nav a:hover {
      opacity: 0.45;
    }

    .hero {
      min-height: 72vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
    }

    .hero h1 {
      font-size: clamp(80px, 18vw, 230px);
      font-weight: 900;
      letter-spacing: -10px;
      line-height: 0.8;
    }

    .hero p {
      margin-top: 35px;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #777;
    }

    .section {
      padding: 80px 6%;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 35px;
    }

    .section-title h2 {
      font-size: 28px;
      letter-spacing: -1px;
    }

    .section-title span {
      font-size: 12px;
      color: #777;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .product {
      position: relative;
      min-height: 480px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 24px;
      background: rgba(245, 245, 245, 0.55);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      overflow: hidden;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .product:hover {
      transform: translateY(-8px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    }

    .product-image {
      height: 350px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #eeeeee, #ffffff);
      overflow: hidden;
    }

    .shirt {
      width: 170px;
      height: 190px;
      background: #111;
      clip-path: polygon(
        25% 0,
        42% 10%,
        50% 17%,
        58% 10%,
        75% 0,
        100% 20%,
        85% 42%,
        72% 32%,
        72% 100%,
        28% 100%,
        28% 32%,
        15% 42%,
        0 20%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shirt span {
      color: white;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 4px;
      transform: translateY(15px);
    }

    .product-info {
      display: flex;
      justify-content: space-between;
      align-items: end;
      padding-top: 18px;
    }

    .product-name {
      font-size: 15px;
      font-weight: 700;
    }

    .product-type {
      margin-top: 5px;
      font-size: 11px;
      color: #888;
    }

    .price {
      font-size: 14px;
      font-weight: 700;
    }

    .buy {
      width: 100%;
      margin-top: 15px;
      padding: 13px;
      border: 0;
      border-radius: 12px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      transition: opacity 0.2s;
    }
